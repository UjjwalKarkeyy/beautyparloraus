<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Brow Beauty Hub Orders</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f0ec;
      color: #333;
      min-height: 100vh;
    }

    /* ─── Login Screen ─────────────────────────── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      text-align: center;
    }
    .login-card h1 { font-size: 1.4rem; color: #8b6f5e; margin-bottom: 8px; }
    .login-card p  { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
    .login-card input {
      width: 100%; padding: 12px 16px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 1rem; margin-bottom: 16px;
      outline: none; transition: border-color .2s;
    }
    .login-card input:focus { border-color: #8b6f5e; }
    .login-card button {
      width: 100%; padding: 12px; background: #8b6f5e; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
      transition: background .2s;
    }
    .login-card button:hover { background: #7a5f4e; }
    .login-error { color: #d9534f; font-size: .85rem; margin-top: 10px; display: none; }

    /* ─── Main App ─────────────────────────────── */
    #app { display: none; }

    header {
      background: #fff;
      border-bottom: 1px solid #e5ddd7;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-left h1 { font-size: 1.15rem; color: #8b6f5e; }
    .header-left span { color: #aaa; font-size: .85rem; }
    #logoutBtn {
      background: none; border: 1.5px solid #ccc; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; color: #666; font-size: .85rem;
      transition: border-color .2s, color .2s;
    }
    #logoutBtn:hover { border-color: #8b6f5e; color: #8b6f5e; }

    .toolbar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 16px 28px; background: #faf7f4; border-bottom: 1px solid #e5ddd7;
    }
    .toolbar select, .toolbar input {
      padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 7px;
      font-size: .9rem; outline: none; background: #fff;
    }
    .toolbar select:focus, .toolbar input:focus { border-color: #8b6f5e; }
    .toolbar .stats { margin-left: auto; font-size: .88rem; color: #888; }

    /* ─── Table ────────────────────────────────── */
    .table-wrap { overflow-x: auto; padding: 20px 28px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    thead th { background: #8b6f5e; color: #fff; padding: 12px 14px; text-align: left; font-weight: 600; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f0ebe6; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #faf7f4; }
    td { padding: 11px 14px; vertical-align: top; }
    td.nowrap { white-space: nowrap; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    }
    .badge-pending   { background: #fff3cd; color: #856404; }
    .badge-confirmed { background: #d1e7dd; color: #0a5c37; }
    .badge-shipped   { background: #cfe2ff; color: #0a367c; }
    .badge-completed { background: #d3f0ea; color: #0d674a; }
    .badge-cancelled { background: #f8d7da; color: #842029; }

    .btn-icon {
      background: none; border: none; cursor: pointer; padding: 4px 6px;
      color: #888; font-size: .95rem; border-radius: 4px;
      transition: color .15s, background .15s;
    }
    .btn-icon:hover { color: #8b6f5e; background: #f0e8e4; }
    .btn-icon.del:hover { color: #d9534f; background: #fde8e8; }

    /* ─── Order Detail Modal ───────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal {
      background: #fff; border-radius: 12px; width: 100%; max-width: 620px;
      max-height: 90vh; overflow-y: auto; padding: 28px 32px;
      transform: translateY(20px); transition: transform .2s;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .modal-head h2 { font-size: 1.1rem; color: #8b6f5e; }
    .modal-head button { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #aaa; }
    .modal-head button:hover { color: #333; }
    .detail-section { margin-bottom: 18px; }
    .detail-section h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: #aaa; margin-bottom: 8px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: .9rem; }
    .detail-grid .k { color: #888; }
    .detail-grid .v { font-weight: 500; }
    .item-row { display: flex; justify-content: space-between; font-size: .9rem; padding: 5px 0; border-bottom: 1px solid #f0ebe6; }
    .item-row:last-child { border-bottom: none; }
    .total-row { display: flex; justify-content: space-between; font-weight: 700; margin-top: 10px; font-size: 1rem; color: #8b6f5e; }

    .status-select {
      padding: 6px 10px; border: 1.5px solid #ddd; border-radius: 6px;
      font-size: .88rem; cursor: pointer; outline: none;
    }
    .status-select:focus { border-color: #8b6f5e; }

    /* ─── Pagination ───────────────────────────── */
    .pagination { display: flex; justify-content: center; gap: 6px; padding: 20px 28px; }
    .pg-btn {
      padding: 7px 13px; border: 1.5px solid #ddd; background: #fff;
      border-radius: 7px; cursor: pointer; font-size: .88rem;
      transition: all .15s;
    }
    .pg-btn:hover:not(:disabled) { border-color: #8b6f5e; color: #8b6f5e; }
    .pg-btn.active { background: #8b6f5e; border-color: #8b6f5e; color: #fff; }
    .pg-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ─── Empty / Loading ──────────────────────── */
    .table-msg { text-align: center; padding: 60px 20px; color: #aaa; font-size: .95rem; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5ddd7; border-top-color: #8b6f5e; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>

<!-- ─── LOGIN ─────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-card">
    <h1><i class="fa-solid fa-lock"></i> Admin Dashboard</h1>
    <p>Brow Beauty Hub — Order Management</p>
    <input type="password" id="keyInput" placeholder="Enter admin key" />
    <button id="loginBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
    <p class="login-error" id="loginError">Incorrect key. Please try again.</p>
  </div>
</div>

<!-- ─── APP ───────────────────────────────────── -->
<div id="app">
  <header>
    <div class="header-left">
      <h1><i class="fa-solid fa-chart-line"></i> Orders</h1>
      <span id="headerSub">Brow Beauty Hub</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="shop.html" style="font-size:.85rem;color:#8b6f5e;text-decoration:none"><i class="fa-solid fa-store"></i> View Shop</a>
      <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="toolbar">
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="shipped">Shipped</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <input type="search" id="searchInput" placeholder="Search name, email, order #…" style="min-width:220px" />
    <button class="pg-btn" id="refreshBtn"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <span class="stats" id="statsText"></span>
  </div>

  <div class="table-wrap">
    <table id="ordersTable">
      <thead>
        <tr>
          <th>Order #</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Email</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="8"><div class="table-msg"><div class="spinner"></div>Loading…</div></td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<!-- ─── ORDER DETAIL MODAL ────────────────────── -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="orderModal">
    <div class="modal-head">
      <h2 id="modalTitle">Order Detail</h2>
      <button id="modalClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────
  // STATE
  // ─────────────────────────────────────────
  let adminKey    = '';
  let currentPage = 1;
  let totalPages  = 1;
  let allOrders   = [];   // local cache for client-side search filter

  // ─────────────────────────────────────────
  // LOGIN
  // ─────────────────────────────────────────
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  async function tryLogin() {
    const key = document.getElementById('keyInput').value.trim();
    if (!key) return;

    // Verify key by making a real API call
    const res = await fetch('/api/orders?page=1', { headers: { 'x-admin-key': key } });
    if (res.ok) {
      adminKey = key;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadOrders();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    adminKey = '';
    document.getElementById('keyInput').value = '';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  });

  // ─────────────────────────────────────────
  // LOAD ORDERS
  // ─────────────────────────────────────────
  async function loadOrders(page = 1) {
    currentPage = page;
    const status = document.getElementById('statusFilter').value;
    let url = `/api/orders?page=${page}`;
    if (status) url += `&status=${encodeURIComponent(status)}`;

    showLoading();

    try {
      const res  = await fetch(url, { headers: { 'x-admin-key': adminKey } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load orders');

      allOrders  = data.orders;
      totalPages = data.pages;
      document.getElementById('statsText').textContent = `${data.total} total order${data.total !== 1 ? 's' : ''}`;
      renderTable(allOrders);
      renderPagination(data.page, data.pages);
    } catch (err) {
      showError(err.message);
    }
  }

  function showLoading() {
    document.getElementById('ordersBody').innerHTML =
      `<tr><td colspan="8"><div class="table-msg"><div class="spinner"></div>Loading…</div></td></tr>`;
  }
  function showError(msg) {
    document.getElementById('ordersBody').innerHTML =
      `<tr><td colspan="8"><div class="table-msg"><i class="fa-solid fa-circle-exclamation" style="color:#d9534f"></i><br>${msg}</div></td></tr>`;
  }

  // ─────────────────────────────────────────
  // RENDER TABLE
  // ─────────────────────────────────────────
  function renderTable(orders) {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = q
      ? orders.filter(o =>
          (o.first_name + ' ' + o.last_name).toLowerCase().includes(q) ||
          o.email.toLowerCase().includes(q) ||
          o.order_number.toLowerCase().includes(q))
      : orders;

    if (filtered.length === 0) {
      document.getElementById('ordersBody').innerHTML =
        `<tr><td colspan="8"><div class="table-msg"><i class="fa-solid fa-inbox" style="font-size:2rem;display:block;margin-bottom:10px"></i>No orders found.</div></td></tr>`;
      return;
    }

    document.getElementById('ordersBody').innerHTML = filtered.map(o => {
      const date = new Date(o.created_at).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' });
      const badge = `<span class="badge badge-${o.status}">${o.status}</span>`;
      const itemCount = o.items.length;
      return `
        <tr>
          <td class="nowrap"><strong>${o.order_number}</strong></td>
          <td class="nowrap">${date}</td>
          <td>${o.first_name} ${o.last_name}</td>
          <td>${o.email}</td>
          <td class="nowrap">${itemCount} item${itemCount !== 1 ? 's' : ''}</td>
          <td class="nowrap">$${o.total.toFixed(2)}</td>
          <td>${badge}</td>
          <td class="nowrap">
            <button class="btn-icon" title="View" onclick="openOrderModal(${o.id})"><i class="fa-solid fa-eye"></i></button>
            <button class="btn-icon del" title="Delete" onclick="deleteOrder(${o.id}, '${o.order_number}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>`;
    }).join('');
  }

  // ─────────────────────────────────────────
  // PAGINATION
  // ─────────────────────────────────────────
  function renderPagination(page, pages) {
    const wrap = document.getElementById('pagination');
    if (pages <= 1) { wrap.innerHTML = ''; return; }

    let html = `<button class="pg-btn" onclick="loadOrders(${page-1})" ${page===1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 1; i <= pages; i++) {
      html += `<button class="pg-btn ${i===page?'active':''}" onclick="loadOrders(${i})">${i}</button>`;
    }
    html += `<button class="pg-btn" onclick="loadOrders(${page+1})" ${page===pages?'disabled':''}><i class="fa-solid fa-chevron-right"></i></button>`;
    wrap.innerHTML = html;
  }

  // ─────────────────────────────────────────
  // ORDER DETAIL MODAL
  // ─────────────────────────────────────────
  async function openOrderModal(id) {
    const res   = await fetch(`/api/orders/${id}`, { headers: { 'x-admin-key': adminKey } });
    const order = await res.json();
    if (!res.ok) return alert(order.error);

    document.getElementById('modalTitle').textContent = `Order ${order.order_number}`;

    const itemsHtml = order.items.map(i =>
      `<div class="item-row"><span>${i.name} × ${i.qty}</span><span>${i.price ? '$' + (i.price * i.qty).toFixed(2) : 'POA'}</span></div>`
    ).join('');

    const date = new Date(order.created_at).toLocaleString('en-AU');
    const statusOptions = ['pending','confirmed','shipped','completed','cancelled']
      .map(s => `<option value="${s}" ${s===order.status?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');

    document.getElementById('modalBody').innerHTML = `
      <div class="detail-section">
        <h4>Customer</h4>
        <div class="detail-grid">
          <span class="k">Name</span><span class="v">${order.first_name} ${order.last_name}</span>
          <span class="k">Email</span><span class="v">${order.email}</span>
          <span class="k">Phone</span><span class="v">${order.phone || '—'}</span>
          <span class="k">Address</span><span class="v">${order.address}, ${order.city} ${order.postcode}</span>
          <span class="k">Placed</span><span class="v">${date}</span>
        </div>
        ${order.notes ? `<p style="margin-top:8px;font-size:.88rem;color:#666"><strong>Notes:</strong> ${order.notes}</p>` : ''}
      </div>
      <div class="detail-section">
        <h4>Items</h4>
        ${itemsHtml}
        <div class="total-row"><span>Total</span><span>$${order.total.toFixed(2)}</span></div>
      </div>
      <div class="detail-section">
        <h4>Status</h4>
        <select class="status-select" id="modalStatus" onchange="updateStatus(${order.id}, this.value)">${statusOptions}</select>
      </div>`;

    document.getElementById('modalBackdrop').classList.add('open');
  }

  document.getElementById('modalClose').addEventListener('click', () =>
    document.getElementById('modalBackdrop').classList.remove('open'));
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target === e.currentTarget) document.getElementById('modalBackdrop').classList.remove('open');
  });

  // ─────────────────────────────────────────
  // UPDATE STATUS
  // ─────────────────────────────────────────
  async function updateStatus(id, status) {
    const res = await fetch(`/api/orders/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
      body: JSON.stringify({ status }),
    });
    if (res.ok) {
      await loadOrders(currentPage);
    } else {
      const d = await res.json();
      alert('Error: ' + d.error);
    }
  }

  // ─────────────────────────────────────────
  // DELETE ORDER
  // ─────────────────────────────────────────
  async function deleteOrder(id, num) {
    if (!confirm(`Delete order ${num}? This cannot be undone.`)) return;
    const res = await fetch(`/api/orders/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-key': adminKey },
    });
    if (res.ok) {
      loadOrders(currentPage);
    } else {
      const d = await res.json();
      alert('Error: ' + d.error);
    }
  }

  // ─────────────────────────────────────────
  // CONTROLS
  // ─────────────────────────────────────────
  document.getElementById('statusFilter').addEventListener('change', () => loadOrders(1));
  document.getElementById('refreshBtn').addEventListener('click', () => loadOrders(currentPage));
  document.getElementById('searchInput').addEventListener('input', () => renderTable(allOrders));
</script>
</body>
</html>
